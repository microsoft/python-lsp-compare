name: Run Benchmarks

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      pull-request-number: ${{ steps.results-pr.outputs.pull-request-number }}
      pull-request-operation: ${{ steps.results-pr.outputs.pull-request-operation }}
      pull-request-head-sha: ${{ steps.results-pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install package
        run: pip install -e .

      - name: Run benchmarks
        run: python -m python_lsp_compare bench-servers --baseline-server pyright

      - id: pr-metadata
        name: Capture PR datetime
        run: echo "timestamp=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - id: results-pr
        name: Create pull request for results
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Update benchmark results from workflow runner
          branch: automation/benchmark-results
          branch-suffix: timestamp
          delete-branch: true
          title: Update benchmark results (${{ steps.pr-metadata.outputs.timestamp }})
          body: |
            Automated benchmark result update from the scheduled workflow run.
          add-paths: |
            latest-results.md
            latest-results/

  approve:
    needs: benchmark
    if: |
      needs.benchmark.outputs.pull-request-operation == 'created' ||
      needs.benchmark.outputs.pull-request-operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.benchmark.outputs.pull-request-number }}
      PR_HEAD_SHA: ${{ needs.benchmark.outputs.pull-request-head-sha }}
    steps:
      - id: review-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.PYTHON_LSP_COMPARE_REVIEW_BOT_APP_ID }}
          private_key: ${{ secrets.PYTHON_LSP_COMPARE_REVIEW_BOT_PRIVATE_KEY }}

      - name: Approve benchmark results commit
        run: |
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE \
            -f commit_id="$PR_HEAD_SHA" \
            --silent
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}

      - name: Enable auto-merge
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --auto \
            --squash \
            --match-head-commit "$PR_HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
