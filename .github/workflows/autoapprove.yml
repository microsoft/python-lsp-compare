name: Auto-approve PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  approve:
    if: |
      github.event.pull_request.user.login == 'python-lsp-compare-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.PYTHON_LSP_COMPARE_REVIEW_BOT_APP_ID }}
          private_key: ${{ secrets.PYTHON_LSP_COMPARE_REVIEW_BOT_PRIVATE_KEY }}

      - name: Auto-approve
        uses: hmarr/auto-approve-action@8f929096a962e83ccdfa8afcf855f39f12d4dac7 # v4
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --auto \
            --squash
        env:
          GH_TOKEN: ${{ github.token }}
